name: Build and Deploy English-3D to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: study/package-lock.json

      - name: Install dependencies and build Practice Buddy (Vite)
        working-directory: ./study
        run: |
          npm ci
          npm run build

      - name: Deploy root index.html to public_html/
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: index.html
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: 65002
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy Vite frontend (study/dist/) to public_html/study/
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='api' --exclude='.htaccess'
          path: study/dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}study/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: 65002
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy PHP backend (study/api/) to public_html/study/api/
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='config.php' --exclude='.env'
          path: study/api/
          remote_path: ${{ secrets.DEPLOY_PATH }}study/api/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: 65002
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}